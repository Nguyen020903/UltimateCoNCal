<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="DmgCal.css">
    <title>CoNCal - Damage Calculator</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5135077083099833"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="damage-calculator">
        <header>
            <h1>Damage Calculator</h1>
            <p>Calculate battle outcomes between different units</p>
        </header>

        <div class="calculator-section unit-comparison">
            <div class="unit-selector">
                <h2>Attacker</h2>
                <div class="unit-controls">
                    <div class="control-group">
                        <label for="attackerDoctrine">Doctrine:</label>
                        <select id="attackerDoctrine">
                            <option value="western">Western</option>
                            <option value="eastern">Eastern</option>
                            <option value="european">European</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="attackerUnitType">Unit Type:</label>
                        <select id="attackerUnitType"></select>
                    </div>
                    <div class="control-group">
                        <label for="attackerUnit">Unit:</label>
                        <select id="attackerUnit"></select>
                    </div>
                    <div class="control-group">
                        <label for="attackerQuantity">Quantity:</label>
                        <input type="number" id="attackerQuantity" value="1" min="1">
                    </div>
                </div>
                <div class="unit-stats" id="attackerUnitStats"></div>
            </div>

            <div class="unit-selector">
                <h2>Defender</h2>
                <div class="unit-controls">
                    <div class="control-group">
                        <label for="defenderDoctrine">Doctrine:</label>
                        <select id="defenderDoctrine">
                            <option value="western">Western</option>
                            <option value="eastern">Eastern</option>
                            <option value="european">European</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="defenderUnitType">Unit Type:</label>
                        <select id="defenderUnitType"></select>
                    </div>
                    <div class="control-group">
                        <label for="defenderUnit">Unit:</label>
                        <select id="defenderUnit"></select>
                    </div>
                    <div class="control-group">
                        <label for="defenderQuantity">Quantity:</label>
                        <input type="number" id="defenderQuantity" value="1" min="1">
                    </div>
                </div>
                <div class="unit-stats" id="defenderUnitStats"></div>
            </div>
        </div>

        <div class="calculator-section battle-conditions">
            <h2>Battle Conditions</h2>
            <div class="conditions-grid">
                <div class="condition-group">
                    <h3>Terrain</h3>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="terrain" value="plains" checked>
                            Plains
                        </label>
                        <label>
                            <input type="radio" name="terrain" value="forest">
                            Forest
                        </label>
                        <label>
                            <input type="radio" name="terrain" value="mountains">
                            Mountains
                        </label>
                        <label>
                            <input type="radio" name="terrain" value="urban">
                            Urban
                        </label>
                    </div>
                </div>

                <div class="condition-group">
                    <h3>Weather</h3>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="weather" value="clear" checked>
                            Clear
                        </label>
                        <label>
                            <input type="radio" name="weather" value="rain">
                            Rain
                        </label>
                        <label>
                            <input type="radio" name="weather" value="snow">
                            Snow
                        </label>
                        <label>
                            <input type="radio" name="weather" value="sandstorm">
                            Sandstorm
                        </label>
                    </div>
                </div>

                <div class="condition-group">
                    <h3>Time of Day</h3>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="time" value="day" checked>
                            Day
                        </label>
                        <label>
                            <input type="radio" name="time" value="night">
                            Night
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="calculate-button">
            <button id="calculate-button">Calculate Battle Outcome</button>
        </div>

        <div class="calculator-section battle-outcome">
            <div class="outcome-header">
                <h3>Battle Outcome</h3>
                <div id="outcomeHeader"></div>
                <div id="outcomeText"></div>
            </div>
            <div class="outcome-details">
                <div class="power-comparison">
                    <div class="power-value">
                        <span class="power-label">Attacker Power:</span>
                        <span class="power-number" id="attacker-power">0</span>
                    </div>
                    <div class="power-value">
                        <span class="power-label">Defender Power:</span>
                        <span class="power-number" id="defender-power">0</span>
                    </div>
                </div>
                <div class="modifiers">
                    <div class="modifier-row">
                        <span class="modifier-label">Terrain Modifier:</span>
                        <span class="modifier-value" id="terrain-modifier">100%</span>
                    </div>
                    <div class="modifier-row">
                        <span class="modifier-label">Weather Modifier:</span>
                        <span class="modifier-value" id="weather-modifier">100%</span>
                    </div>
                    <div class="modifier-row">
                        <span class="modifier-label">Time Modifier:</span>
                        <span class="modifier-value" id="time-modifier">100%</span>
                    </div>
                </div>
            </div>
            <div id="battle-outcome"></div>
        </div>
    </div>

    <script src="DmgCal.js"></script>
</body>

</html>
