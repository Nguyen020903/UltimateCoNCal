<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="DmgCal.css">
    <title>CoNCal - Damage Calculator</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5135077083099833"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="damage-calculator">
        <header>
            <h1>Damage Calculator</h1>
            <p>Calculate battle outcomes between different units</p>
        </header>

        <div class="calculator-section unit-comparison">
            <div class="unit-selector">
                <h2>Attacker</h2>
                <div class="unit-controls">
                    <div class="control-group">
                        <label for="attackerDoctrine">Doctrine:</label>
                        <select id="attackerDoctrine">
                            <option value="western">Western</option>
                            <option value="eastern">Eastern</option>
                            <option value="european">European</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="attackerUnitType">Unit Type:</label>
                        <select id="attackerUnitType"></select>
                    </div>
                    <div class="control-group">
                        <label for="attackerUnit">Unit:</label>
                        <select id="attackerUnit"></select>
                    </div>
                    <div class="control-group">
                        <label for="attackerQuantity">Quantity:</label>
                        <input type="number" id="attackerQuantity" value="1" min="1">
                    </div>
                </div>
                <div class="unit-stats" id="attackerUnitStats"></div>
            </div>

            <div class="unit-selector">
                <h2>Defender</h2>
                <div class="unit-controls">
                    <div class="control-group">
                        <label for="defenderDoctrine">Doctrine:</label>
                        <select id="defenderDoctrine">
                            <option value="western">Western</option>
                            <option value="eastern">Eastern</option>
                            <option value="european">European</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="defenderUnitType">Unit Type:</label>
                        <select id="defenderUnitType"></select>
                    </div>
                    <div class="control-group">
                        <label for="defenderUnit">Unit:</label>
                        <select id="defenderUnit"></select>
                    </div>
                    <div class="control-group">
                        <label for="defenderQuantity">Quantity:</label>
                        <input type="number" id="defenderQuantity" value="1" min="1">
                    </div>
                </div>
                <div class="unit-stats" id="defenderUnitStats"></div>
            </div>
        </div>

        <div class="calculator-section battle-conditions">
            <h2>Battle Conditions</h2>
            <div class="conditions-grid">
                <div class="condition-group">
                    <h3>Terrain</h3>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="terrain" value="plains" checked>
                            Plains
                        </label>
                        <label>
                            <input type="radio" name="terrain" value="forest">
                            Forest
                        </label>
                        <label>
                            <input type="radio" name="terrain" value="mountains">
                            Mountains
                        </label>
                        <label>
                            <input type="radio" name="terrain" value="urban">
                            Urban
                        </label>
                    </div>
                </div>

                <div class="condition-group">
                    <h3>Weather</h3>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="weather" value="clear" checked>
                            Clear
                        </label>
                        <label>
                            <input type="radio" name="weather" value="rain">
                            Rain
                        </label>
                        <label>
                            <input type="radio" name="weather" value="snow">
                            Snow
                        </label>
                        <label>
                            <input type="radio" name="weather" value="storm">
                            Storm
                        </label>
                    </div>
                </div>

                <div class="condition-group">
                    <h3>Time of Day</h3>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="time" value="day" checked>
                            Day
                        </label>
                        <label>
                            <input type="radio" name="time" value="night">
                            Night
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="calculate-button">
            <button id="calculate-button">Calculate Battle Outcome</button>
        </div>

        <div class="calculator-section battle-outcome">
            <div class="outcome-header">
                <h3>Battle Outcome</h3>
                <div id="outcomeHeader"></div>
                <div id="outcomeText"></div>
            </div>
            <div class="outcome-details">
                <div class="power-comparison">
                    <div class="power-value">
                        <span class="power-label">Attacker Power:</span>
                        <span class="power-number" id="attacker-power">0</span>
                    </div>
                    <div class="power-value">
                        <span class="power-label">Defender Power:</span>
                        <span class="power-number" id="defender-power">0</span>
                    </div>
                </div>
                <div class="modifiers">
                    <div class="modifier-row">
                        <span class="modifier-label">Terrain Modifier:</span>
                        <span class="modifier-value" id="terrain-modifier">100%</span>
                    </div>
                    <div class="modifier-row">
                        <span class="modifier-label">Weather Modifier:</span>
                        <span class="modifier-value" id="weather-modifier">100%</span>
                    </div>
                    <div class="modifier-row">
                        <span class="modifier-label">Time Modifier:</span>
                        <span class="modifier-value" id="time-modifier">100%</span>
                    </div>
                </div>
            </div>
            <div id="battle-outcome"></div>
        </div>
    </div>

    <script src="DmgCal.js"></script>
    <script>
        // Main calculation function
        function calculateBattle() {
            // Get attacker values
            const attackerDoctrine = document.getElementById('attacker-doctrine').value;
            const attackerUnitId = document.getElementById('attacker-unit').value;
            const attackerQuantity = parseInt(document.getElementById('attacker-quantity').value) || 1;
            
            // Get defender values
            const defenderDoctrine = document.getElementById('defender-doctrine').value;
            const defenderUnitId = document.getElementById('defender-unit').value;
            const defenderQuantity = parseInt(document.getElementById('defender-quantity').value) || 1;
            
            // Get battle conditions
            const terrain = document.querySelector('input[name="terrain"]:checked').value;
            const weather = document.querySelector('input[name="weather"]:checked').value;
            const timeOfDay = document.querySelector('input[name="time"]:checked').value;
            
            // Find the unit objects
            let attackerUnit = null;
            let defenderUnit = null;
            
            // Search through unitData to find the selected units
            for (const category in unitData[attackerDoctrine]) {
                for (const unitKey in unitData[attackerDoctrine][category]) {
                    const unit = unitData[attackerDoctrine][category][unitKey];
                    if (unit.id === attackerUnitId) {
                        attackerUnit = unit;
                        break;
                    }
                }
                if (attackerUnit) break;
            }
            
            for (const category in unitData[defenderDoctrine]) {
                for (const unitKey in unitData[defenderDoctrine][category]) {
                    const unit = unitData[defenderDoctrine][category][unitKey];
                    if (unit.id === defenderUnitId) {
                        defenderUnit = unit;
                        break;
                    }
                }
                if (defenderUnit) break;
            }
            
            if (!attackerUnit || !defenderUnit) {
                document.getElementById('battle-outcome').innerHTML = '<p>Error: Could not find selected units.</p>';
                return;
            }
            
            // Calculate base attack power
            const baseAttackerPower = attackerUnit.attack * attackerQuantity;
            const baseDefenderPower = defenderUnit.defense * defenderQuantity;
            
            // Calculate modifiers
            const terrainModifier = getTerrainModifier(terrain, attackerUnit.type, defenderUnit.type);
            const weatherModifier = getWeatherModifier(weather, attackerUnit.type, defenderUnit.type);
            const timeModifier = getTimeModifier(timeOfDay, attackerUnit.type, defenderUnit.type);
            
            // Calculate effective power
            const effectiveAttackerPower = baseAttackerPower * terrainModifier * weatherModifier * timeModifier;
            
            // Calculate defense modifiers
            const terrainDefenseModifier = terrainModifiers[terrain][defenderUnit.type]?.defense || 1.0;
            const weatherDefenseModifier = weatherModifiers[weather][defenderUnit.type]?.defense || 1.0;
            const timeDefenseModifier = timeModifiers[timeOfDay][defenderUnit.type]?.defense || 1.0;
            
            // Calculate effective defense power
            const effectiveDefenderPower = baseDefenderPower * terrainDefenseModifier * weatherDefenseModifier * timeDefenseModifier;
            
            // Calculate damage dealt
            const attackerDamage = Math.max(0, effectiveAttackerPower - effectiveDefenderPower * 0.5);
            const defenderDamage = Math.max(0, effectiveDefenderPower * 0.3 - effectiveAttackerPower * 0.1);
            
            // Calculate casualties
            const defenderCasualties = Math.min(defenderQuantity, Math.ceil(attackerDamage / defenderUnit.hp));
            const attackerCasualties = Math.min(attackerQuantity, Math.ceil(defenderDamage / attackerUnit.hp));
            
            // Calculate battle outcome
            let outcome = '';
            if (defenderCasualties >= defenderQuantity && attackerCasualties < attackerQuantity) {
                outcome = 'Attacker victory';
            } else if (attackerCasualties >= attackerQuantity && defenderCasualties < defenderQuantity) {
                outcome = 'Defender victory';
            } else if (attackerCasualties >= attackerQuantity && defenderCasualties >= defenderQuantity) {
                outcome = 'Mutual destruction';
            } else {
                outcome = 'Inconclusive';
            }
            
            // Display results
            document.getElementById('battle-outcome').innerHTML = `
                <h3>Battle Outcome: ${outcome}</h3>
                <div class="outcome-details">
                    <div class="power-comparison">
                        <h4>Power Comparison</h4>
                        <div class="comparison-row">
                            <span>Base Attack Power:</span>
                            <span>${baseAttackerPower.toFixed(1)} (${attackerUnit.attack} × ${attackerQuantity})</span>
                        </div>
                        <div class="comparison-row">
                            <span>Terrain Modifier:</span>
                            <span>${terrainModifier.toFixed(2)}×</span>
                        </div>
                        <div class="comparison-row">
                            <span>Weather Modifier:</span>
                            <span>${weatherModifier.toFixed(2)}×</span>
                        </div>
                        <div class="comparison-row">
                            <span>Time Modifier:</span>
                            <span>${timeModifier.toFixed(2)}×</span>
                        </div>
                        <div class="comparison-row total">
                            <span>Effective Attack Power:</span>
                            <span>${effectiveAttackerPower.toFixed(1)}</span>
                        </div>
                    </div>
                    
                    <div class="power-comparison">
                        <h4>Defense Comparison</h4>
                        <div class="comparison-row">
                            <span>Base Defense Power:</span>
                            <span>${baseDefenderPower.toFixed(1)} (${defenderUnit.defense} × ${defenderQuantity})</span>
                        </div>
                        <div class="comparison-row">
                            <span>Terrain Modifier:</span>
                            <span>${terrainDefenseModifier.toFixed(2)}×</span>
                        </div>
                        <div class="comparison-row">
                            <span>Weather Modifier:</span>
                            <span>${weatherDefenseModifier.toFixed(2)}×</span>
                        </div>
                        <div class="comparison-row">
                            <span>Time Modifier:</span>
                            <span>${timeDefenseModifier.toFixed(2)}×</span>
                        </div>
                        <div class="comparison-row total">
                            <span>Effective Defense Power:</span>
                            <span>${effectiveDefenderPower.toFixed(1)}</span>
                        </div>
                    </div>
                </div>
                
                <div class="casualties">
                    <h4>Casualties</h4>
                    <div class="casualties-row">
                        <span>Attacker (${attackerUnit.name}):</span>
                        <span>${attackerCasualties} / ${attackerQuantity}</span>
                    </div>
                    <div class="casualties-row">
                        <span>Defender (${defenderUnit.name}):</span>
                        <span>${defenderCasualties} / ${defenderQuantity}</span>
                    </div>
                </div>
                
                <div class="unit-stats">
                    <h4>Unit Statistics</h4>
                    <div class="unit-stats-container">
                        <div class="unit-stats-column">
                            <h5>${attackerUnit.name} (Attacker)</h5>
                            <div class="stat-row"><span>Attack:</span> <span>${attackerUnit.attack}</span></div>
                            <div class="stat-row"><span>Defense:</span> <span>${attackerUnit.defense}</span></div>
                            <div class="stat-row"><span>HP:</span> <span>${attackerUnit.hp}</span></div>
                            <div class="stat-row"><span>Speed:</span> <span>${attackerUnit.speed}</span></div>
                            <div class="stat-row"><span>Range:</span> <span>${attackerUnit.range}</span></div>
                        </div>
                        <div class="unit-stats-column">
                            <h5>${defenderUnit.name} (Defender)</h5>
                            <div class="stat-row"><span>Attack:</span> <span>${defenderUnit.attack}</span></div>
                            <div class="stat-row"><span>Defense:</span> <span>${defenderUnit.defense}</span></div>
                            <div class="stat-row"><span>HP:</span> <span>${defenderUnit.hp}</span></div>
                            <div class="stat-row"><span>Speed:</span> <span>${defenderUnit.speed}</span></div>
                            <div class="stat-row"><span>Range:</span> <span>${defenderUnit.range}</span></div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Function to update the stats display when a unit is selected
        function updateUnitStats(side) {
            const unitId = document.getElementById(`${side}-unit`).value;
            const statsContainer = document.getElementById(`${side}-unit-stats`);
            
            if (!unitId) {
                statsContainer.innerHTML = '<p>Select a unit to see stats</p>';
                return;
            }
            
            let selectedUnit = null;
            const doctrine = document.getElementById(`${side}-doctrine`).value;
            
            // Find the selected unit in unitData
            for (const category in unitData[doctrine]) {
                for (const unitKey in unitData[doctrine][category]) {
                    const unit = unitData[doctrine][category][unitKey];
                    if (unit.id === unitId) {
                        selectedUnit = unit;
                        break;
                    }
                }
                if (selectedUnit) break;
            }
            
            if (selectedUnit) {
                statsContainer.innerHTML = `
                    <div class="stat"><span>Attack:</span> <span>${selectedUnit.attack}</span></div>
                    <div class="stat"><span>Defense:</span> <span>${selectedUnit.defense}</span></div>
                    <div class="stat"><span>HP:</span> <span>${selectedUnit.hp}</span></div>
                    <div class="stat"><span>Speed:</span> <span>${selectedUnit.speed}</span></div>
                    <div class="stat"><span>Range:</span> <span>${selectedUnit.range}</span></div>
                    <div class="stat"><span>Type:</span> <span>${selectedUnit.type}</span></div>
                `;
            } else {
                statsContainer.innerHTML = '<p>Unit not found</p>';
            }
        }

        // Initialize the page when it's loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize doctrine dropdowns
            const doctrines = ['western', 'eastern', 'european'];
            
            const attackerDoctrine = document.getElementById('attacker-doctrine');
            const defenderDoctrine = document.getElementById('defender-doctrine');
            
            doctrines.forEach(doctrine => {
                const option = document.createElement('option');
                option.value = doctrine;
                option.textContent = doctrine.charAt(0).toUpperCase() + doctrine.slice(1);
                attackerDoctrine.appendChild(option.cloneNode(true));
                defenderDoctrine.appendChild(option);
            });
            
            // Set up event listeners
            attackerDoctrine.addEventListener('change', () => updateUnitOptions('attacker'));
            defenderDoctrine.addEventListener('change', () => updateUnitOptions('defender'));
            
            document.getElementById('attacker-unit').addEventListener('change', () => updateUnitStats('attacker'));
            document.getElementById('defender-unit').addEventListener('change', () => updateUnitStats('defender'));
            
            document.getElementById('calculate-button').addEventListener('click', calculateBattle);
            
            // Initialize unit options for both sides
            updateUnitOptions('attacker');
            updateUnitOptions('defender');
        });
    </script>
</body>

</html>
