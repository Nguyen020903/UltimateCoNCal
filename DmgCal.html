<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="DmgCal.css">
    <script src="unit-selector.js"></script>
    <title>CoNCal - Damage Calculator</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5135077083099833"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="damage-calculator">
        <header>
            <h1>Damage Calculator</h1>
            <p>Calculate battle outcomes between different units</p>
        </header>

        <div class="calculator-section unit-comparison">
            <div class="unit-selector">
                <h2>Attacker</h2>
                <div class="unit-controls">
                    <div class="control-group">
                        <label for="attacker-doctrine">Doctrine:</label>
                        <select id="attacker-doctrine"></select>
                    </div>
                    <div class="control-group">
                        <label for="attacker-unit">Unit:</label>
                        <select id="attacker-unit"></select>
                    </div>
                    <div class="control-group">
                        <label for="attacker-quantity">Quantity:</label>
                        <input type="number" id="attacker-quantity" value="1" min="1">
                    </div>
                </div>
                <div class="unit-stats" id="attacker-stats"></div>
            </div>

            <div class="unit-selector">
                <h2>Defender</h2>
                <div class="unit-controls">
                    <div class="control-group">
                        <label for="defender-doctrine">Doctrine:</label>
                        <select id="defender-doctrine"></select>
                    </div>
                    <div class="control-group">
                        <label for="defender-unit">Unit:</label>
                        <select id="defender-unit"></select>
                    </div>
                    <div class="control-group">
                        <label for="defender-quantity">Quantity:</label>
                        <input type="number" id="defender-quantity" value="1" min="1">
                    </div>
                </div>
                <div class="unit-stats" id="defender-stats"></div>
            </div>
        </div>

        <div class="calculator-section battle-conditions">
            <h2>Battle Conditions</h2>
            <div class="conditions-grid">
                <div class="condition-group">
                    <h3>Terrain</h3>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="terrain" value="plains" checked>
                            Plains
                        </label>
                        <label>
                            <input type="radio" name="terrain" value="forest">
                            Forest
                        </label>
                        <label>
                            <input type="radio" name="terrain" value="mountains">
                            Mountains
                        </label>
                        <label>
                            <input type="radio" name="terrain" value="urban">
                            Urban
                        </label>
                    </div>
                </div>

                <div class="condition-group">
                    <h3>Weather</h3>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="weather" value="clear" checked>
                            Clear
                        </label>
                        <label>
                            <input type="radio" name="weather" value="rain">
                            Rain
                        </label>
                        <label>
                            <input type="radio" name="weather" value="snow">
                            Snow
                        </label>
                        <label>
                            <input type="radio" name="weather" value="storm">
                            Storm
                        </label>
                    </div>
                </div>

                <div class="condition-group">
                    <h3>Time of Day</h3>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="time" value="day" checked>
                            Day
                        </label>
                        <label>
                            <input type="radio" name="time" value="night">
                            Night
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="calculator-section battle-outcome">
            <div class="outcome-header">
                <h3>Battle Outcome</h3>
            </div>
            <div class="outcome-details">
                <div class="power-comparison">
                    <div class="power-value">
                        <span class="power-label">Attacker Power:</span>
                        <span class="power-number" id="attacker-power">0</span>
                    </div>
                    <div class="power-value">
                        <span class="power-label">Defender Power:</span>
                        <span class="power-number" id="defender-power">0</span>
                    </div>
                </div>
                <div class="modifiers">
                    <div class="modifier-row">
                        <span class="modifier-label">Terrain Modifier:</span>
                        <span class="modifier-value" id="terrain-modifier">100%</span>
                    </div>
                    <div class="modifier-row">
                        <span class="modifier-label">Weather Modifier:</span>
                        <span class="modifier-value" id="weather-modifier">100%</span>
                    </div>
                    <div class="modifier-row">
                        <span class="modifier-label">Time Modifier:</span>
                        <span class="modifier-value" id="time-modifier">100%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="DmgCal.js"></script>
    <script>
        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            updateAttackerUnits();
            updateDefenderUnits();
            calculateDamage();
        });
        
        // Update attacker units based on selected doctrine
        function updateAttackerUnits() {
            const doctrine = document.getElementById('attacker-doctrine').value;
            const unitSelect = document.getElementById('attacker-unit');
            
            // Clear existing options
            unitSelect.innerHTML = '';
            
            // Add units from the selected doctrine
            Object.values(unitData[doctrine]).forEach(category => {
                category.forEach(unit => {
                    const option = document.createElement('option');
                    option.value = unit.id;
                    option.textContent = unit.name;
                    unitSelect.appendChild(option);
                });
            });
            
            updateAttackerStats();
        }
        
        // Update defender units based on selected doctrine
        function updateDefenderUnits() {
            const doctrine = document.getElementById('defender-doctrine').value;
            const unitSelect = document.getElementById('defender-unit');
            
            // Clear existing options
            unitSelect.innerHTML = '';
            
            // Add units from the selected doctrine
            Object.values(unitData[doctrine]).forEach(category => {
                category.forEach(unit => {
                    const option = document.createElement('option');
                    option.value = unit.id;
                    option.textContent = unit.name;
                    unitSelect.appendChild(option);
                });
            });
            
            updateDefenderStats();
        }
        
        // Update attacker stats display
        function updateAttackerStats() {
            const doctrine = document.getElementById('attacker-doctrine').value;
            const unitId = document.getElementById('attacker-unit').value;
            const statsDiv = document.getElementById('attacker-stats');
            
            // Find the unit data
            let unitData = null;
            Object.values(unitData[doctrine]).forEach(category => {
                category.forEach(unit => {
                    if (unit.id === unitId) {
                        unitData = unit;
                    }
                });
            });
            
            if (unitData) {
                statsDiv.innerHTML = `
                    <div class="stat-row">
                        <span class="stat-label">Health:</span>
                        <span class="stat-value">${unitData.health}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Armor:</span>
                        <span class="stat-value">${unitData.armor}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Damage:</span>
                        <span class="stat-value">${unitData.damage}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Range:</span>
                        <span class="stat-value">${unitData.range}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Speed:</span>
                        <span class="stat-value">${unitData.speed}</span>
                    </div>
                `;
            }
            
            calculateDamage();
        }
        
        // Update defender stats display
        function updateDefenderStats() {
            const doctrine = document.getElementById('defender-doctrine').value;
            const unitId = document.getElementById('defender-unit').value;
            const statsDiv = document.getElementById('defender-stats');
            
            // Find the unit data
            let unitData = null;
            Object.values(unitData[doctrine]).forEach(category => {
                category.forEach(unit => {
                    if (unit.id === unitId) {
                        unitData = unit;
                    }
                });
            });
            
            if (unitData) {
                statsDiv.innerHTML = `
                    <div class="stat-row">
                        <span class="stat-label">Health:</span>
                        <span class="stat-value">${unitData.health}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Armor:</span>
                        <span class="stat-value">${unitData.armor}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Damage:</span>
                        <span class="stat-value">${unitData.damage}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Range:</span>
                        <span class="stat-value">${unitData.range}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Speed:</span>
                        <span class="stat-value">${unitData.speed}</span>
                    </div>
                `;
            }
            
            calculateDamage();
        }
        
        // Calculate damage and battle outcome
        function calculateDamage() {
            const attackerDoctrine = document.getElementById('attacker-doctrine').value;
            const attackerUnitId = document.getElementById('attacker-unit').value;
            const attackerQuantity = parseInt(document.getElementById('attacker-quantity').value);
            
            const defenderDoctrine = document.getElementById('defender-doctrine').value;
            const defenderUnitId = document.getElementById('defender-unit').value;
            const defenderQuantity = parseInt(document.getElementById('defender-quantity').value);
            
            const terrain = document.querySelector('input[name="terrain"]:checked').value;
            const weather = document.querySelector('input[name="weather"]:checked').value;
            const time = document.querySelector('input[name="time"]:checked').value;
            
            // Find the unit data
            let attackerUnit = null;
            let defenderUnit = null;
            
            Object.values(unitData[attackerDoctrine]).forEach(category => {
                category.forEach(unit => {
                    if (unit.id === attackerUnitId) {
                        attackerUnit = unit;
                    }
                });
            });
            
            Object.values(unitData[defenderDoctrine]).forEach(category => {
                category.forEach(unit => {
                    if (unit.id === defenderUnitId) {
                        defenderUnit = unit;
                    }
                });
            });
            
            if (!attackerUnit || !defenderUnit) {
                return;
            }
            
            // Calculate power
            const attackerPower = attackerUnit.damage * attackerUnit.speed;
            const defenderPower = defenderUnit.damage * defenderUnit.speed;
            
            // Calculate modifiers
            const terrainModifier = getTerrainModifier(terrain, attackerUnit.type, defenderUnit.type);
            const weatherModifier = getWeatherModifier(weather, attackerUnit.type, defenderUnit.type);
            const timeModifier = getTimeModifier(time, attackerUnit.type, defenderUnit.type);
            
            // Calculate effective power
            const effectiveAttackerPower = attackerPower * terrainModifier * weatherModifier * timeModifier;
            const effectiveDefenderPower = defenderPower * terrainModifier * weatherModifier * timeModifier;
            
            // Display power
            const attackerPowerDisplay = document.getElementById('attacker-power');
            const defenderPowerDisplay = document.getElementById('defender-power');
            attackerPowerDisplay.textContent = effectiveAttackerPower.toFixed(2);
            defenderPowerDisplay.textContent = effectiveDefenderPower.toFixed(2);
            
            // Calculate battle outcome
            let battleOutcome = '';
            let outcomeClass = '';
            
            if (effectiveAttackerPower > effectiveDefenderPower) {
                battleOutcome = 'Attacker Victory';
                outcomeClass = 'victory';
            } else if (effectiveDefenderPower > effectiveAttackerPower) {
                battleOutcome = 'Defender Victory';
                outcomeClass = 'defeat';
            } else {
                battleOutcome = 'Stalemate';
                outcomeClass = 'stalemate';
            }
            
            // Display battle outcome
            const outcomeDiv = document.getElementById('battle-outcome');
            outcomeDiv.innerHTML = `
                <div class="outcome-header ${outcomeClass}">
                    <h3>${battleOutcome}</h3>
                </div>
                <div class="outcome-details">
                    <div class="power-comparison">
                        <div class="power-value">
                            <span class="power-label">Attacker Power:</span>
                            <span class="power-number">${effectiveAttackerPower.toFixed(2)}</span>
                        </div>
                        <div class="power-value">
                            <span class="power-label">Defender Power:</span>
                            <span class="power-number">${effectiveDefenderPower.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="modifiers">
                        <div class="modifier-row">
                            <span class="modifier-label">Terrain Modifier:</span>
                            <span class="modifier-value">${terrainModifier.toFixed(2) * 100}%</span>
                        </div>
                        <div class="modifier-row">
                            <span class="modifier-label">Weather Modifier:</span>
                            <span class="modifier-value">${weatherModifier.toFixed(2) * 100}%</span>
                        </div>
                        <div class="modifier-row">
                            <span class="modifier-label">Time Modifier:</span>
                            <span class="modifier-value">${timeModifier.toFixed(2) * 100}%</span>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Get terrain modifier based on unit types
        function getTerrainModifier(terrain, attackerType, defenderType) {
            const modifier = 1;
            
            // Apply terrain modifiers based on unit types
            switch (terrain) {
                case 'plains':
                    // No special modifiers for plains
                    break;
                    
                case 'forest':
                    // Infantry and light units get bonuses in forest
                    if (attackerType === 'infantry' || attackerType === 'light') {
                        modifier *= 1.2;
                    }
                    if (defenderType === 'infantry' || defenderType === 'light') {
                        modifier *= 1.2;
                    }
                    
                    // Heavy units get penalties in forest
                    if (attackerType === 'heavy') {
                        modifier *= 0.8;
                    }
                    if (defenderType === 'heavy') {
                        modifier *= 0.8;
                    }
                    break;
                    
                case 'urban':
                    // Infantry get bonuses in urban areas
                    if (attackerType === 'infantry') {
                        modifier *= 1.3;
                    }
                    if (defenderType === 'infantry') {
                        modifier *= 1.3;
                    }
                    
                    // Vehicles get penalties in urban areas
                    if (attackerType === 'armored' || attackerType === 'heavy') {
                        modifier *= 0.7;
                    }
                    if (defenderType === 'armored' || defenderType === 'heavy') {
                        modifier *= 0.7;
                    }
                    break;
                    
                case 'mountain':
                    // Infantry get bonuses in mountains
                    if (attackerType === 'infantry') {
                        modifier *= 1.2;
                    }
                    if (defenderType === 'infantry') {
                        modifier *= 1.2;
                    }
                    
                    // Vehicles get penalties in mountains
                    if (attackerType === 'armored' || attackerType === 'heavy') {
                        modifier *= 0.6;
                    }
                    if (defenderType === 'armored' || defenderType === 'heavy') {
                        modifier *= 0.6;
                    }
                    break;
                    
                case 'desert':
                    // Light vehicles get bonuses in desert
                    if (attackerType === 'light') {
                        modifier *= 1.1;
                    }
                    if (defenderType === 'light') {
                        modifier *= 1.1;
                    }
                    
                    // Infantry get penalties in desert
                    if (attackerType === 'infantry') {
                        modifier *= 0.9;
                    }
                    if (defenderType === 'infantry') {
                        modifier *= 0.9;
                    }
                    break;
            }
            
            return modifier;
        }
        
        // Get weather modifier based on unit types
        function getWeatherModifier(weather, attackerType, defenderType) {
            const modifier = 1;
            
            // Apply weather modifiers based on unit types
            switch (weather) {
                case 'clear':
                    // No special modifiers for clear weather
                    break;
                    
                case 'rain':
                    // Air units get penalties in rain
                    if (attackerType === 'air') {
                        modifier *= 0.8;
                    }
                    if (defenderType === 'air') {
                        modifier *= 0.8;
                    }
                    
                    // Naval units get bonuses in rain
                    if (attackerType === 'naval') {
                        modifier *= 1.1;
                    }
                    if (defenderType === 'naval') {
                        modifier *= 1.1;
                    }
                    break;
                    
                case 'snow':
                    // All units get penalties in snow
                    modifier *= 0.9;
                    
                    // Air units get extra penalties in snow
                    if (attackerType === 'air') {
                        modifier *= 0.7;
                    }
                    if (defenderType === 'air') {
                        modifier *= 0.7;
                    }
                    break;
                    
                case 'storm':
                    // All units get penalties in storm
                    modifier *= 0.8;
                    
                    // Air units get extra penalties in storm
                    if (attackerType === 'air') {
                        modifier *= 0.6;
                    }
                    if (defenderType === 'air') {
                        modifier *= 0.6;
                    }
                    break;
            }
            
            return modifier;
        }
        
        // Get time of day modifier based on unit types
        function getTimeModifier(time, attackerType, defenderType) {
            const modifier = 1;
            
            // Apply time of day modifiers based on unit types
            switch (time) {
                case 'day':
                    // No special modifiers for day
                    break;
                    
                case 'night':
                    // All units get penalties at night
                    modifier *= 0.9;
                    
                    // Air units get extra penalties at night
                    if (attackerType === 'air') {
                        modifier *= 0.7;
                    }
                    if (defenderType === 'air') {
                        modifier *= 0.7;
                    }
                    
                    // Specialized night units get bonuses at night
                    if (attackerType === 'special') {
                        modifier *= 1.2;
                    }
                    if (defenderType === 'special') {
                        modifier *= 1.2;
                    }
                    break;
            }
            
            return modifier;
        }
    </script>
</body>

</html>
