<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoNCal - Production Planner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="production-planner.css">
</head>
<body>
    <header class="universal-header">
        <h1 align="center"><b>CoNCal - Production Planner</b></h1>
    </header>

    <div class="production-planner">
        <div class="controls">
            <h2>Production Settings</h2>
            <div>
                <label for="gameDays">Number of Game Days:</label>
                <input type="number" id="gameDays" value="7" min="1" max="30" onchange="initializeCalendar(this.value)">
            </div>
            <div>
                <label for="doctrine">Doctrine:</label>
                <select id="doctrine" onchange="updateDoctrine(this.value)">
                    <option value="western">Western</option>
                    <option value="eastern">Eastern</option>
                    <option value="european">European</option>
                </select>
            </div>
            <div class="action-buttons">
                <button onclick="saveProductionPlan()" class="action-button save-button">Save Plan</button>
                <button onclick="loadProductionPlan()" class="action-button load-button">Load Plan</button>
                <button onclick="clearAllUnits()" class="action-button clear-button">Clear All</button>
            </div>
        </div>

        <div class="unit-bank">
            <h2>Available Units</h2>
            <!-- Units will be populated by JavaScript -->
        </div>

        <div class="calendar-container" id="calendar">
            <!-- Calendar days will be populated by JavaScript -->
        </div>

        <div class="resource-summary">
            <div class="resource-item">
                <h3>Total Resources Required</h3>
                <div id="totalResources"></div>
            </div>
            <div class="resource-item">
                <h3>Production Timeline</h3>
                <div id="productionTimeline"></div>
            </div>
        </div>
    </div>

    <script src="production-planner.js"></script>
    <script>
        // Initialize the calendar
        function initializeCalendar(days) {
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';
            
            for (let i = 1; i <= days; i++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                dayElement.setAttribute('data-day', i);
                dayElement.innerHTML = `<h3>Day ${i}</h3>`;
                
                // Add drag and drop event listeners
                dayElement.addEventListener('dragover', handleDragOver);
                dayElement.addEventListener('drop', handleDrop);
                dayElement.addEventListener('dragleave', handleDragLeave);
                
                calendar.appendChild(dayElement);
            }
            updateResourceSummary();
        }

        // Populate the unit bank with units from the selected doctrine
        function populateUnitBank(doctrine) {
            const unitBank = document.querySelector('.unit-bank');
            const doctrineUnits = unitData[doctrine];
            
            // Clear existing units
            unitBank.innerHTML = '<h2>Available Units</h2>';
            
            // Add units to the bank
            Object.keys(doctrineUnits).forEach(category => {
                doctrineUnits[category].forEach(unit => {
                    const unitCard = document.createElement('div');
                    unitCard.className = 'unit-card';
                    unitCard.setAttribute('draggable', 'true');
                    unitCard.setAttribute('data-unit', JSON.stringify(unit));
                    
                    unitCard.innerHTML = `
                        <div class="unit-name">${unit.name}</div>
                        <div class="unit-level">
                            <input type="number" min="1" max="3" value="1" class="level-input" title="Unit Level">
                        </div>
                        <div class="unit-details collapsed">
                            <div>Production Time: ${unit.productionTime} days</div>
                            <div class="unit-resources">
                                <div class="resource-header">Production Resources (Level 1):</div>
                                <div>Manpower: ${unit.resources.manpower}</div>
                                <div>Supplies: ${unit.resources.supplies}</div>
                                <div>Fuel: ${unit.resources.fuel}</div>
                                <div>Components: ${unit.resources.components}</div>
                                <div>Rare Materials: ${unit.resources.rareMaterials}</div>
                                <div class="resource-header">Daily Upkeep (Level 1):</div>
                                <div>Manpower: ${unit.upkeep.manpower}</div>
                                <div>Supplies: ${unit.upkeep.supplies}</div>
                                <div>Fuel: ${unit.upkeep.fuel}</div>
                                <div>Components: ${unit.upkeep.components}</div>
                                <div>Rare Materials: ${unit.upkeep.rareMaterials}</div>
                            </div>
                        </div>
                        <div class="unit-actions">
                            <button onclick="toggleUnitDetails(this.parentElement.parentElement)">Details</button>
                        </div>
                    `;
                    
                    // Add event listener to update resources on level change
                    const levelInput = unitCard.querySelector('.level-input');
                    levelInput.addEventListener('change', function() {
                        updateUnitCardResources(unitCard, this.value);
                    });
                    
                    // Add drag event listeners
                    unitCard.addEventListener('dragstart', handleDragStart);
                    
                    unitBank.appendChild(unitCard);
                });
            });
        }

        // Update unit card resources based on level
        function updateUnitCardResources(unitCard, level) {
            const unitData = JSON.parse(unitCard.getAttribute('data-unit'));
            // For now, we'll use multiplier based on level
            const levelMultiplier = parseInt(level) || 1;
            const multiplier = 1 + (levelMultiplier - 1) * 0.25; // 25% increase per level
            
            const resourcesDiv = unitCard.querySelector('.unit-resources');
            resourcesDiv.innerHTML = `
                <div class="resource-header">Production Resources (Level ${level}):</div>
                <div>Manpower: ${Math.round(unitData.resources.manpower * multiplier)}</div>
                <div>Supplies: ${Math.round(unitData.resources.supplies * multiplier)}</div>
                <div>Fuel: ${Math.round(unitData.resources.fuel * multiplier)}</div>
                <div>Components: ${Math.round(unitData.resources.components * multiplier)}</div>
                <div>Rare Materials: ${Math.round(unitData.resources.rareMaterials * multiplier)}</div>
                <div class="resource-header">Daily Upkeep (Level ${level}):</div>
                <div>Manpower: ${Math.round(unitData.upkeep.manpower * multiplier)}</div>
                <div>Supplies: ${Math.round(unitData.upkeep.supplies * multiplier)}</div>
                <div>Fuel: ${Math.round(unitData.upkeep.fuel * multiplier)}</div>
                <div>Components: ${Math.round(unitData.upkeep.components * multiplier)}</div>
                <div>Rare Materials: ${Math.round(unitData.upkeep.rareMaterials * multiplier)}</div>
            `;
        }

        // Handle drag start
        function handleDragStart(e) {
            const unitData = JSON.parse(e.currentTarget.getAttribute('data-unit'));
            const level = e.currentTarget.querySelector('.level-input').value;
            
            const dragData = {
                unitData: unitData,
                level: parseInt(level)
            };
            
            e.dataTransfer.setData('text/plain', JSON.stringify(dragData));
            e.dataTransfer.effectAllowed = 'copy';
        }

        // Handle drag and drop functionality
        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('dragover');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            const dayElement = e.currentTarget;
            dayElement.classList.remove('dragover');
            
            const dragData = JSON.parse(e.dataTransfer.getData('text/plain'));
            showQuantityDialog(dayElement, dragData.unitData, dragData.level);
        }

        function showQuantityDialog(dayElement, unitData, level) {
            // Create dialog container
            const dialog = document.createElement('div');
            dialog.className = 'quantity-dialog';
            
            // Create dialog content
            dialog.innerHTML = `
                <div class="dialog-content">
                    <h3>Select Quantity</h3>
                    <div class="unit-info">
                        <div class="unit-name">${unitData.name} (Level ${level})</div>
                        <div class="unit-details">
                            <div>Production Time: ${unitData.productionTime} days</div>
                        </div>
                    </div>
                    <div class="quantity-selector">
                        <label for="quantity">Quantity:</label>
                        <input type="number" id="quantity" value="1" min="1" max="100">
                    </div>
                    <div class="dialog-buttons">
                        <button onclick="addUnitToDay(this.parentElement.parentElement.parentElement, ${JSON.stringify(unitData)}, ${level})">Add</button>
                        <button onclick="this.parentElement.parentElement.parentElement.remove()">Cancel</button>
                    </div>
                </div>
            `;
            
            // Add dialog to the page
            document.body.appendChild(dialog);
            
            // Focus on the quantity input
            setTimeout(() => {
                document.getElementById('quantity').focus();
            }, 100);
        }

        function addUnitToDay(dialog, unitData, level) {
            const quantity = parseInt(document.getElementById('quantity').value);
            const dayElement = document.querySelector('.calendar-day.dragover') || 
                              document.querySelector(`.calendar-day[data-day="${dialog.getAttribute('data-day')}]`);
            
            if (!dayElement) {
                dialog.remove();
                return;
            }
            
            // Use a multiplier based on level
            const levelMultiplier = level || 1;
            const multiplier = 1 + (levelMultiplier - 1) * 0.25; // 25% increase per level
            
            const unitCard = document.createElement('div');
            unitCard.className = 'unit-card';
            unitCard.setAttribute('data-unit', JSON.stringify(unitData));
            unitCard.setAttribute('data-quantity', quantity);
            unitCard.setAttribute('data-level', level);
            unitCard.innerHTML = `
                <div class="unit-name">${unitData.name} (${quantity}x) - Lvl ${level}</div>
                <div class="unit-details collapsed">
                    <div>Production Time: ${unitData.productionTime} days</div>
                    <div class="unit-resources">
                        <div class="resource-header">Production Resources:</div>
                        <div>Manpower: ${Math.round(unitData.resources.manpower * multiplier) * quantity}</div>
                        <div>Supplies: ${Math.round(unitData.resources.supplies * multiplier) * quantity}</div>
                        <div>Fuel: ${Math.round(unitData.resources.fuel * multiplier) * quantity}</div>
                        <div>Components: ${Math.round(unitData.resources.components * multiplier) * quantity}</div>
                        <div>Rare Materials: ${Math.round(unitData.resources.rareMaterials * multiplier) * quantity}</div>
                        <div class="resource-header">Daily Upkeep:</div>
                        <div>Manpower: ${Math.round(unitData.upkeep.manpower * multiplier) * quantity}</div>
                        <div>Supplies: ${Math.round(unitData.upkeep.supplies * multiplier) * quantity}</div>
                        <div>Fuel: ${Math.round(unitData.upkeep.fuel * multiplier) * quantity}</div>
                        <div>Components: ${Math.round(unitData.upkeep.components * multiplier) * quantity}</div>
                        <div>Rare Materials: ${Math.round(unitData.upkeep.rareMaterials * multiplier) * quantity}</div>
                    </div>
                </div>
                <div class="unit-actions">
                    <button onclick="toggleUnitDetails(this.parentElement.parentElement)">Details</button>
                    <button onclick="editUnitQuantity(this.parentElement.parentElement)">Edit</button>
                    <button onclick="this.parentElement.parentElement.remove(); updateResourceSummary()">Remove</button>
                </div>
            `;
            
            dayElement.appendChild(unitCard);
            dialog.remove();
            updateResourceSummary();
        }

        function toggleUnitDetails(unitCard) {
            const detailsElement = unitCard.querySelector('.unit-details');
            detailsElement.classList.toggle('collapsed');
            
            const button = unitCard.querySelector('.unit-actions button:first-child');
            button.textContent = detailsElement.classList.contains('collapsed') ? 'Details' : 'Hide';
        }

        function editUnitQuantity(unitCard) {
            const unitData = JSON.parse(unitCard.getAttribute('data-unit'));
            const currentQuantity = parseInt(unitCard.getAttribute('data-quantity'));
            const currentLevel = parseInt(unitCard.getAttribute('data-level'));
            
            // Create dialog container
            const dialog = document.createElement('div');
            dialog.className = 'quantity-dialog';
            
            // Create dialog content
            dialog.innerHTML = `
                <div class="dialog-content">
                    <h3>Edit Unit</h3>
                    <div class="unit-info">
                        <div class="unit-name">${unitData.name}</div>
                        <div class="unit-details">
                            <div>Production Time: ${unitData.productionTime} days</div>
                        </div>
                    </div>
                    <div class="edit-controls">
                        <div class="quantity-selector">
                            <label for="quantity">Quantity:</label>
                            <input type="number" id="quantity" value="${currentQuantity}" min="1" max="100">
                        </div>
                        <div class="level-selector">
                            <label for="level">Level:</label>
                            <input type="number" id="level" value="${currentLevel}" min="1" max="3">
                        </div>
                    </div>
                    <div class="dialog-buttons">
                        <button onclick="updateUnitQuantity(this.parentElement.parentElement.parentElement, ${JSON.stringify(unitData)}, '${unitCard.id}')">Update</button>
                        <button onclick="this.parentElement.parentElement.parentElement.remove()">Cancel</button>
                    </div>
                </div>
            `;
            
            // Generate a unique ID for the unit card if it doesn't have one
            if (!unitCard.id) {
                unitCard.id = 'unit-' + Math.random().toString(36).substr(2, 9);
            }
            
            // Add dialog to the page
            document.body.appendChild(dialog);
            
            // Focus on the quantity input
            setTimeout(() => {
                document.getElementById('quantity').focus();
            }, 100);
        }

        function updateUnitQuantity(dialog, unitData, unitCardId) {
            const quantity = parseInt(document.getElementById('quantity').value);
            const level = parseInt(document.getElementById('level').value);
            const unitCard = document.getElementById(unitCardId);
            
            if (!unitCard) {
                dialog.remove();
                return;
            }
            
            // Use a multiplier based on level
            const levelMultiplier = level || 1;
            const multiplier = 1 + (levelMultiplier - 1) * 0.25; // 25% increase per level
            
            unitCard.setAttribute('data-quantity', quantity);
            unitCard.setAttribute('data-level', level);
            unitCard.querySelector('.unit-name').textContent = `${unitData.name} (${quantity}x) - Lvl ${level}`;
            
            // Update resource display
            const resourcesDiv = unitCard.querySelector('.unit-resources');
            resourcesDiv.innerHTML = `
                <div class="resource-header">Production Resources:</div>
                <div>Manpower: ${Math.round(unitData.resources.manpower * multiplier) * quantity}</div>
                <div>Supplies: ${Math.round(unitData.resources.supplies * multiplier) * quantity}</div>
                <div>Fuel: ${Math.round(unitData.resources.fuel * multiplier) * quantity}</div>
                <div>Components: ${Math.round(unitData.resources.components * multiplier) * quantity}</div>
                <div>Rare Materials: ${Math.round(unitData.resources.rareMaterials * multiplier) * quantity}</div>
                <div class="resource-header">Daily Upkeep:</div>
                <div>Manpower: ${Math.round(unitData.upkeep.manpower * multiplier) * quantity}</div>
                <div>Supplies: ${Math.round(unitData.upkeep.supplies * multiplier) * quantity}</div>
                <div>Fuel: ${Math.round(unitData.upkeep.fuel * multiplier) * quantity}</div>
                <div>Components: ${Math.round(unitData.upkeep.components * multiplier) * quantity}</div>
                <div>Rare Materials: ${Math.round(unitData.upkeep.rareMaterials * multiplier) * quantity}</div>
            `;
            
            dialog.remove();
            updateResourceSummary();
        }

        function updateDoctrine(doctrine) {
            populateUnitBank(doctrine);
            updateResourceSummary();
        }

        // Calculate total resources required for the production plan
        function calculateTotalResources(productionPlan) {
            const totalResources = {
                manpower: 0,
                supplies: 0,
                fuel: 0,
                components: 0,
                rareMaterials: 0
            };
            
            productionPlan.forEach(day => {
                day.units.forEach(unit => {
                    const unitData = unit.unitData;
                    const quantity = unit.quantity;
                    const level = unit.level;
                    
                    // Use a multiplier based on level
                    const levelMultiplier = level || 1;
                    const multiplier = 1 + (levelMultiplier - 1) * 0.25; // 25% increase per level
                    
                    totalResources.manpower += Math.round(unitData.resources.manpower * multiplier) * quantity;
                    totalResources.supplies += Math.round(unitData.resources.supplies * multiplier) * quantity;
                    totalResources.fuel += Math.round(unitData.resources.fuel * multiplier) * quantity;
                    totalResources.components += Math.round(unitData.resources.components * multiplier) * quantity;
                    totalResources.rareMaterials += Math.round(unitData.resources.rareMaterials * multiplier) * quantity;
                });
            });
            
            return totalResources;
        }

        // Format resources for display
        function formatResources(resources) {
            return `
                <div class="resource-list">
                    <div class="resource-section">
                        <h4>Production Resources</h4>
                        <div class="resource-item">
                            <span class="resource-label">Manpower:</span>
                            <span class="resource-value">${resources.manpower}</span>
                        </div>
                        <div class="resource-item">
                            <span class="resource-label">Supplies:</span>
                            <span class="resource-value">${resources.supplies}</span>
                        </div>
                        <div class="resource-item">
                            <span class="resource-label">Fuel:</span>
                            <span class="resource-value">${resources.fuel}</span>
                        </div>
                        <div class="resource-item">
                            <span class="resource-label">Components:</span>
                            <span class="resource-value">${resources.components}</span>
                        </div>
                        <div class="resource-item">
                            <span class="resource-label">Rare Materials:</span>
                            <span class="resource-value">${resources.rareMaterials}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Generate production timeline
        function generateProductionTimeline(productionPlan) {
            const timeline = [];
            
            productionPlan.forEach(day => {
                day.units.forEach(unit => {
                    const unitData = unit.unitData;
                    const quantity = unit.quantity;
                    const level = unit.level;
                    const startDay = day.day;
                    const endDay = startDay + unitData.productionTime - 1;
                    
                    timeline.push({
                        unit: unitData.name,
                        quantity: quantity,
                        level: level,
                        startDay: startDay,
                        endDay: endDay
                    });
                });
            });
            
            // Sort timeline by start day
            timeline.sort((a, b) => a.startDay - b.startDay);
            
            return timeline;
        }

        // Update resource summary
        function updateResourceSummary() {
            const productionPlan = getProductionPlan();
            const totalResources = calculateTotalResources(productionPlan);
            document.getElementById('totalResources').innerHTML = formatResources(totalResources);
            
            const timeline = generateProductionTimeline(productionPlan);
            document.getElementById('productionTimeline').innerHTML = formatTimeline(timeline);
        }

        function getProductionPlan() {
            const plan = [];
            const days = document.querySelectorAll('.calendar-day');
            
            days.forEach(day => {
                const dayNumber = parseInt(day.getAttribute('data-day'));
                const units = Array.from(day.querySelectorAll('.unit-card')).map(card => {
                    const unitData = JSON.parse(card.getAttribute('data-unit'));
                    const quantity = parseInt(card.getAttribute('data-quantity')) || 1;
                    const level = parseInt(card.getAttribute('data-level')) || 1;
                    return {
                        unitData,
                        quantity,
                        level
                    };
                });
                
                plan.push({
                    day: dayNumber,
                    units
                });
            });
            
            return plan;
        }

        function formatTimeline(timeline) {
            if (timeline.length === 0) {
                return '<p>No units in production</p>';
            }

            return timeline.map(item => `
                <div class="timeline-item">
                    <p>${item.unit} (${item.quantity}x) - Level ${item.level}</p>
                    <p>Days ${item.startDay}-${item.endDay}</p>
                </div>
            `).join('');
        }

        // Save and load functionality
        function saveProductionPlan() {
            const plan = getProductionPlan();
            const doctrine = document.getElementById('doctrine').value;
            const gameDays = document.getElementById('gameDays').value;
            
            const saveData = {
                plan,
                doctrine,
                gameDays
            };
            
            const saveDataString = JSON.stringify(saveData);
            localStorage.setItem('productionPlan', saveDataString);
            
            alert('Production plan saved successfully!');
        }

        function loadProductionPlan() {
            const saveDataString = localStorage.getItem('productionPlan');
            
            if (!saveDataString) {
                alert('No saved production plan found.');
                return;
            }
            
            const saveData = JSON.parse(saveDataString);
            
            // Set the doctrine and game days
            document.getElementById('doctrine').value = saveData.doctrine;
            document.getElementById('gameDays').value = saveData.gameDays;
            
            // Initialize the calendar with the saved number of days
            initializeCalendar(saveData.gameDays);
            
            // Populate the unit bank with the saved doctrine
            populateUnitBank(saveData.doctrine);
            
            // Clear any existing units
            clearAllUnits(false);
            
            // Add the saved units to the calendar
            saveData.plan.forEach(day => {
                const dayElement = document.querySelector(`.calendar-day[data-day="${day.day}"]`);
                
                if (dayElement) {
                    day.units.forEach(unit => {
                        const unitData = unit.unitData;
                        const quantity = unit.quantity;
                        const level = unit.level || 1;
                        
                        // Use a multiplier based on level
                        const levelMultiplier = level;
                        const multiplier = 1 + (levelMultiplier - 1) * 0.25; // 25% increase per level
                        
                        const unitCard = document.createElement('div');
                        unitCard.className = 'unit-card';
                        unitCard.setAttribute('data-unit', JSON.stringify(unitData));
                        unitCard.setAttribute('data-quantity', quantity);
                        unitCard.setAttribute('data-level', level);
                        unitCard.innerHTML = `
                            <div class="unit-name">${unitData.name} (${quantity}x) - Lvl ${level}</div>
                            <div class="unit-details collapsed">
                                <div>Production Time: ${unitData.productionTime} days</div>
                                <div class="unit-resources">
                                    <div class="resource-header">Production Resources:</div>
                                    <div>Manpower: ${Math.round(unitData.resources.manpower * multiplier) * quantity}</div>
                                    <div>Supplies: ${Math.round(unitData.resources.supplies * multiplier) * quantity}</div>
                                    <div>Fuel: ${Math.round(unitData.resources.fuel * multiplier) * quantity}</div>
                                    <div>Components: ${Math.round(unitData.resources.components * multiplier) * quantity}</div>
                                    <div>Rare Materials: ${Math.round(unitData.resources.rareMaterials * multiplier) * quantity}</div>
                                    <div class="resource-header">Daily Upkeep:</div>
                                    <div>Manpower: ${Math.round(unitData.upkeep.manpower * multiplier) * quantity}</div>
                                    <div>Supplies: ${Math.round(unitData.upkeep.supplies * multiplier) * quantity}</div>
                                    <div>Fuel: ${Math.round(unitData.upkeep.fuel * multiplier) * quantity}</div>
                                    <div>Components: ${Math.round(unitData.upkeep.components * multiplier) * quantity}</div>
                                    <div>Rare Materials: ${Math.round(unitData.upkeep.rareMaterials * multiplier) * quantity}</div>
                                </div>
                            </div>
                            <div class="unit-actions">
                                <button onclick="toggleUnitDetails(this.parentElement.parentElement)">Details</button>
                                <button onclick="editUnitQuantity(this.parentElement.parentElement)">Edit</button>
                                <button onclick="this.parentElement.parentElement.remove(); updateResourceSummary()">Remove</button>
                            </div>
                        `;
                        
                        dayElement.appendChild(unitCard);
                    });
                }
            });
            
            updateResourceSummary();
            alert('Production plan loaded successfully!');
        }

        function clearAllUnits(showAlert = true) {
            const unitCards = document.querySelectorAll('.calendar-day .unit-card');
            
            unitCards.forEach(card => {
                card.remove();
            });
            
            updateResourceSummary();
            
            if (showAlert) {
                alert('All units have been cleared from the calendar.');
            }
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            initializeCalendar(7);
            populateUnitBank('western');
        });
    </script>
</body>
</html>
